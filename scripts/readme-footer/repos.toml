# Per-repository settings for the standard README footer.
# Keys left out of a repository fall back to [defaults].

[defaults]
sdk = "built"      # "built": builds with the SDK; "thanks": does not
releases = false   # true: binary releases come from this repository's tags
risk = true        # include the "use at your own risk" bullet
trademarks = ""    # extra sentence appended to the affiliation bullet
license_extra = "" # extra sentence appended to the license paragraph
license = ""       # replaces the whole license paragraph when set
gpl = true         # the project is GPL: cite its warranty sections

[text]
built = "Built with the [PS5 Payload SDK](https://github.com/ps5-payload-dev/sdk) by John Törnblom (ps5-payload-dev)."
thanks = "Thanks to John Törnblom (ps5-payload-dev) for the [PS5 Payload SDK](https://github.com/ps5-payload-dev/sdk), which much of the PS5 homebrew scene is built on."
license = "Copyright © 2026 BlackBearReloaded. Licensed under GPL-3.0-or-later; see [LICENSE](LICENSE). Third-party components keep their own licenses."
gpl_ref = " See sections 15 and 16 of the GPL."
releases = "Binary releases are built from the tagged source in this repository."
risk = """

- **Use at your own risk.** Running homebrew requires a modified console, which
  may void its warranty, breach the platform's terms of service, or cause data
  loss."""

